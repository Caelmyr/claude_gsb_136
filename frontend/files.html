<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件浏览 · DFSVS</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">文件浏览</h1>
        <div class="sub" id="page-sub">目录树 · 缩略图 · 块与副本详情</div>
      </div>
      <div class="spacer"></div>
      <div class="userchip" id="userchip"></div>
    </header>

    <section class="content">
      <div class="split-view">
        <!-- 左：目录树 -->
        <div class="side fixed" style="width:270px;flex-basis:270px">
          <div class="card" style="padding:12px">
            <div class="card-title">目录树
              <span class="spacer"></span>
              <button class="btn xs" id="btn-refresh-tree" title="刷新">⟳</button>
            </div>
            <div class="tree scroll-y" id="tree" style="max-height:66vh"></div>
            <hr class="hr">
            <div class="small muted" id="trash-hint"></div>
            <a class="btn sm ghost" href="recycle.html" style="margin-top:8px">🗑 打开回收站</a>
          </div>
        </div>

        <!-- 右：文件网格 -->
        <div class="side grow">
          <div class="toolbar">
            <div class="breadcrumb" id="breadcrumb"></div>
            <div class="spacer"></div>
            <button class="btn sm" id="btn-policy" title="按目录切换冗余方式">🔀 冗余策略</button>
            <button class="btn sm" id="btn-mkdir">＋ 新建目录</button>
            <a class="btn sm" id="btn-upload" href="transfer.html">⇧ 上传文件</a>
            <button class="btn sm ghost" id="btn-refresh">⟳</button>
          </div>

          <div class="card" style="padding:14px">
            <div class="file-grid" id="file-grid"></div>
          </div>

          <!-- 详情抽屉 -->
          <div class="card" id="detail-card" style="display:none">
            <div class="card-title"><span id="detail-title">详情</span>
              <span class="spacer"></span>
              <button class="btn xs ghost" id="detail-close">✕ 关闭</button>
            </div>
            <div id="detail-body"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div id="toasts"></div>
<script src="js/app.js"></script>
<script>
"use strict";
const { api, esc, fmtBytes, fmtTs, fmtAgo, toast, modal, confirmDlg, promptDlg,
        fileIcon, thumbUrl, healthBadge, getToken } = DFSVS;

let currentPath = DFSVS.qs("path", "/");
let selected = null;      // 当前选中条目
let expanded = new Set(["/"]);

// 冗余方式徽标：三副本 / 纠删码
function storageTag(storage, profile) {
  if (storage === "ec") {
    const p = (profile || "ec").replace("ec-", "");
    return `<span class="badge violet plain" title="纠删码（数据分片+校验分片）">🧩 EC ${esc(p)}</span>`;
  }
  return `<span class="badge acc plain" title="三副本">⧉ 3 副本</span>`;
}
function dirPolicyMark(node) {
  if (node.type !== "dir" || !node.storage_policy) return "";
  return node.storage_policy === "ec"
    ? `<span class="badge violet plain" style="font-size:10px;padding:0 5px" title="目录策略：纠删码 ${esc(node.ec_profile || "")}">EC</span>`
    : `<span class="badge acc plain" style="font-size:10px;padding:0 5px" title="目录策略：三副本">3×</span>`;
}

// ------------------------------------------------------------------ 目录树
async function loadTree() {
  const data = await api("GET", "/api/fs/tree");
  const box = document.getElementById("tree");
  box.innerHTML = "";
  box.appendChild(buildTreeNode(data.tree, "/"));
  document.getElementById("trash-hint").textContent =
    `回收站：${data.trash.count} 项 / ${fmtBytes(data.trash.bytes)}（保留 ${data.trash.retention_days} 天）`;
}

function buildTreeNode(node, path) {
  const wrap = document.createElement("div");
  const row = document.createElement("div");
  row.className = "t-node" + (path === currentPath ? " sel" : "");
  const isDir = node.type === "dir";
  const isOpen = expanded.has(path);
  row.innerHTML = `
    <span class="tw">${isDir ? (isOpen ? "▾" : "▸") : ""}</span>
    <span>${isDir ? (isOpen ? "🗂" : "🗀") : fileIcon(node)}</span>
    <span class="tn">${esc(node.name)} ${dirPolicyMark(node)}</span>
    <span class="ts">${isDir ? (node.file_count ?? "") : fmtBytes(node.size)}</span>`;
  row.onclick = (e) => {
    e.stopPropagation();
    if (isDir) {
      if (expanded.has(path)) expanded.delete(path); else expanded.add(path);
      currentPath = path;
      refresh();
    } else {
      currentPath = path.split("/").slice(0, -1).join("/") || "/";
      selectEntry({ ...node, path, type: "file" });
      refresh();
    }
  };
  wrap.appendChild(row);
  if (isDir && isOpen && node.children) {
    const kids = document.createElement("div");
    kids.className = "t-kids";
    for (const c of node.children) {
      const cpath = path === "/" ? "/" + c.name : path + "/" + c.name;
      kids.appendChild(buildTreeNode(c, cpath));
    }
    wrap.appendChild(kids);
  }
  return wrap;
}

// ------------------------------------------------------------------ 列表
async function loadList() {
  const data = await api("GET", "/api/fs/list?path=" + encodeURIComponent(currentPath));
  renderBreadcrumb(data);
  renderGrid(data.items);
  return data;
}

function renderBreadcrumb(data) {
  const box = document.getElementById("breadcrumb");
  let html = `<span class="seg" data-p="/">🏠 /</span>`;
  let acc = "";
  for (const seg of data.breadcrumb) {
    acc += "/" + seg;
    html += `<span class="sep">›</span><span class="seg" data-p="${esc(acc)}">${esc(seg)}</span>`;
  }
  box.innerHTML = html;
  box.querySelectorAll(".seg").forEach(el =>
    el.onclick = () => { currentPath = el.dataset.p; expanded.add(currentPath); refresh(); });
}

function renderGrid(items) {
  const grid = document.getElementById("file-grid");
  if (!items.length) {
    grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
      <div class="big">🗀</div>此目录为空<br>
      <span class="small">点击右上角「上传文件」或「新建目录」</span></div>`;
    return;
  }
  grid.innerHTML = items.map((it, i) => `
    <div class="fcard ${selected && selected.path === it.path ? "sel" : ""}" data-i="${i}">
      ${it.type === "file" ? `<span class="health-dot ${it.health || "ok"}" title="冗余健康: ${it.health || "ok"}"></span>` : ""}
      <div class="thumb">
        ${it.thumb ? `<img loading="lazy" src="${esc(thumbUrl(it.path))}" alt="" onerror="this.parentElement.textContent='🖼'">` : fileIcon(it)}
      </div>
      <div class="fname">${esc(it.name)}</div>
      <div class="fmeta">${it.type === "dir" ? (it.children + " 项") : fmtBytes(it.size)} · ${fmtAgo(it.modified_at)}</div>
      ${it.type === "file" ? `<div class="fmeta" style="margin-top:2px">${storageTag(it.storage, it.ec_profile)}</div>` : ""}
    </div>`).join("");
  grid.querySelectorAll(".fcard").forEach(el => {
    const it = items[+el.dataset.i];
    el.onclick = () => {
      if (it.type === "dir") {
        currentPath = it.path;
        expanded.add(currentPath);
        selected = null;
        refresh();
      } else {
        selectEntry(it);
      }
    };
    el.ondblclick = () => {
      if (it.type === "file") previewFile(it);
    };
  });
}

// ------------------------------------------------------------------ 详情
async function selectEntry(it) {
  selected = it;
  document.querySelectorAll(".fcard").forEach(el => el.classList.remove("sel"));
  const card = document.getElementById("detail-card");
  card.style.display = "";
  document.getElementById("detail-title").innerHTML =
    `${fileIcon(it)} ${esc(it.path || it.name)} <span class="muted small">详情</span>`;
  const body = document.getElementById("detail-body");
  body.innerHTML = `<div class="empty small">加载中 …</div>`;
  try {
    const [st, blocks] = await Promise.all([
      api("GET", "/api/fs/stat?path=" + encodeURIComponent(it.path)),
      api("GET", "/api/file/blocks?path=" + encodeURIComponent(it.path)),
    ]);
    const s = st.stat;
    body.innerHTML = `
      <div class="split-view">
        <div class="side grow">
          <div class="kv">
            <span class="k">路径</span><span class="v">${esc(s.path)}</span>
            <span class="k">类型</span><span class="v">${s.type === "dir" ? "目录" : esc(s.mime || "文件")}</span>
            <span class="k">冗余方式</span><span class="v">${storageTag(s.storage, s.ec_profile)}
              ${s.storage === "ec" ? `<span class="small muted">任意 ${ecTol(s.ec_profile)} 个分片存活即可还原</span>` : '<span class="small muted">同一份数据存 3 份</span>'}</span>
            <span class="k">大小</span><span class="v">${fmtBytes(s.size)}（${s.size} B）</span>
            <span class="k">内容哈希</span><span class="v">${esc((s.content_hash || "-").slice(0, 24))}…</span>
            <span class="k">属主 / 模式</span><span class="v">${esc(s.owner)} · ${esc(s.mode)}</span>
            <span class="k">创建 / 修改</span><span class="v">${fmtTs(s.created_at)} · ${fmtTs(s.modified_at)}</span>
            <span class="k">覆盖版本</span><span class="v">v${s.file_version}</span>
            <span class="k">访问</span><span class="v">${s.access_count} 次 · 最近 ${fmtAgo(s.last_access)}</span>
          </div>
          <div class="btn-group" style="margin-top:14px">
            <button class="btn sm primary" id="d-preview">👁 预览</button>
            <button class="btn sm" id="d-download">⇩ 下载</button>
            <button class="btn sm" id="d-rename">✎ 重命名</button>
            <button class="btn sm" id="d-history">⑂ 版本历史</button>
            <button class="btn sm danger" id="d-delete">🗑 删除</button>
          </div>
        </div>
        <div class="side grow">
          ${blocks.storage === "ec" ? renderEcDetail(blocks) : `
          <div class="small muted" style="margin-bottom:6px">
            块与副本（${blocks.blocks.length} 块 · 逻辑 ${fmtBytes(blocks.size)}）</div>
          <div class="table-wrap scroll-y" style="max-height:300px">
          <table class="tbl">
            <thead><tr><th>块</th><th class="right">大小</th><th>genstamp</th><th>健康</th><th>副本（节点:状态）</th></tr></thead>
            <tbody>
              ${blocks.blocks.map(b => b.missing ? `
                <tr><td class="mono">${esc(b.id.slice(-8))}</td><td colspan="4"><span class="badge bad">块丢失</span></td></tr>` : `
                <tr>
                  <td class="mono" title="${esc(b.id)}\nsha256 ${esc(b.checksum)}…">${esc(b.short)}</td>
                  <td class="num right">${fmtBytes(b.size)}</td>
                  <td class="num">#${b.genstamp}</td>
                  <td>${healthBadge(b.status)} <span class="mono small">${b.live}/${b.desired}</span></td>
                  <td>${b.replicas.map(r => `
                    <span class="badge plain ${r.state === "ok" && r.live ? "ok" : r.state === "corrupt" ? "bad" : "warn"}"
                          title="genstamp #${r.genstamp} · ${r.rack || ""}">${esc(r.node)}${r.state !== "ok" ? ":" + esc(r.state) : ""}</span>`).join(" ") || '<span class="muted">无</span>'}</td>
                </tr>`).join("")}
            </tbody>
          </table></div>`}
        </div>
      </div>`;
    if (blocks.storage === "ec") bindEcPolling(s.path);
    document.getElementById("d-preview").onclick = () => previewFile(s);
    document.getElementById("d-download").onclick = () =>
      location.href = DFSVS.downloadUrl(s.path);
    document.getElementById("d-rename").onclick = () => renameEntry(s);
    document.getElementById("d-delete").onclick = () => deleteEntry(s);
    document.getElementById("d-history").onclick = () =>
      location.href = "versions.html?path=" + encodeURIComponent(s.path);
  } catch (e) {
    body.innerHTML = `<div class="empty small">加载详情失败：${esc(e.message)}</div>`;
  }
}

// EC 容错数文案
function ecTol(profile) {
  const m = String(profile || "ec-2+1").split("+")[1] || "1";
  return m;
}
function ecStatusBadge(st) {
  if (st === "healthy") return '<span class="badge ok plain">健康</span>';
  if (st === "degraded") return '<span class="badge warn plain">降级·自动修复中</span>';
  return '<span class="badge bad plain">危急·可用分片不足</span>';
}

// EC 文件详情：每组 k+m 分片矩阵（数据/校验、落点节点、修复进度）
function renderEcDetail(blocks) {
  const totalShards = blocks.groups.reduce((a, g) => a + (g.k + g.m), 0);
  const logical = fmtBytes(blocks.size);
  const groupsHtml = blocks.groups.map((g, gi) => {
    const rb = g.rebuild;
    const progress = rb ? (rb.progress || `${(rb.done||[]).length}/${rb.missing_total}`) : null;
    return `
    <div style="border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <b class="small">条带组 #${gi+1}</b>
        <span class="mono small muted">${esc(g.short)}</span>
        <span class="badge dim plain">${esc(g.profile)} · ${g.k}+${g.m}</span>
        ${ecStatusBadge(g.status)}
        <span class="mono small">可用分片 ${g.available}/${g.k + g.m}</span>
        <span class="spacer"></span>
        <span class="small muted">逻辑 ${fmtBytes(g.data_len)} · 每分片 ${fmtBytes(g.shard_size)}</span>
      </div>
      ${g.status !== "healthy" ? `
      <div class="small" style="margin:4px 0">
        ${progress ? `<span class="badge warn plain">自动修复进度 ${esc(progress)}</span>` : '<span class="badge dim plain">等待调度…</span>'}
        ${rb && rb.last_error ? `<span class="small bad">${esc(rb.last_error)}</span>` : ""}
      </div>
      <div class="pbar thin ${g.status === "critical" ? "bad" : "warn"}" style="margin:4px 0 8px">
        <i style="width:${Math.round(((rb?.done||[]).length / Math.max(1, rb?.missing_total||1))*100)}%"></i></div>` : ""}
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${g.shards.map(sh => `
          <div class="ec-shard ${sh.state}" title="${esc(sh.checksum)}…">
            <div class="es-idx">${sh.kind === "data" ? "D" : "P"}${sh.index < g.k ? sh.index : sh.index - g.k}</div>
            <div class="es-node">${sh.state === "ok" ? esc(sh.nodes.join(",")) :
              sh.state === "recovering" ? "→ " + esc(sh.recovering_to || "?") : "缺失"}</div>
          </div>`).join("")}
      </div>
    </div>`;
  }).join("");
  return `
    <div class="small muted" style="margin-bottom:6px">
      纠删码分片（${blocks.groups.length} 个条带组 · ${totalShards} 个分片 · 逻辑 ${logical}）
      · 空间开销 ×1.5，任意分片损坏可自动还原
    </div>
    <div class="scroll-y" style="max-height:330px">${groupsHtml}</div>`;
}

// EC 详情打开期间，若非健康态则 2.5s 轮询刷新进度（只读抽屉打开时）
let ecPollStop = null;
function bindEcPolling(path) {
  if (ecPollStop) { ecPollStop(); ecPollStop = null; }
  let stop = false;
  const tick = async () => {
    if (stop) return;
    try {
      const d = await api("GET", "/api/file/blocks?path=" + encodeURIComponent(path));
      if (d.storage !== "ec" || d.status === "healthy") { stop = true; return; }
      if (!document.getElementById("detail-card") ||
          document.getElementById("detail-card").style.display === "none") {
        stop = true; return;
      }
      const box = document.querySelector("#detail-body");
      if (box) box.querySelectorAll(".side.grow")[1].innerHTML = renderEcDetail(d);
    } catch (e) {}
    setTimeout(tick, 2500);
  };
  setTimeout(tick, 2500);
  ecPollStop = () => { stop = true; };
}

async function previewFile(it) {
  try {
    const p = await api("GET", "/api/file/preview?path=" + encodeURIComponent(it.path));
    const m = modal({
      title: `预览 · ${it.path}`, wide: true, hideCancel: true, okText: "关闭",
      body: p.is_text
        ? `<div class="small muted" style="margin-bottom:8px">
             ${esc(p.mime)} · ${fmtBytes(p.size)}${p.truncated ? "（已截断）" : ""} ·
             读自节点 ${(p.nodes || []).join(",") || "缓存"}</div>
           <div class="pre-wrap" style="max-height:60vh">${esc(p.content || "")}</div>`
        : `<div class="empty">
             <div class="big">${fileIcon(it)}</div>
             二进制文件（${esc(p.mime)}，${fmtBytes(p.size)}），不支持文本预览。<br><br>
             <a class="btn primary sm" href="${esc(DFSVS.downloadUrl(it.path))}">⇩ 下载文件</a>
           </div>`,
    });
  } catch (e) { toast("预览失败：" + e.message, "bad"); }
}

// ------------------------------------------------------------------ 操作
function renameEntry(it) {
  promptDlg("重命名", [{ name: "name", label: "新名称", value: it.name }],
    async (v) => {
      try {
        const r = await api("POST", "/api/fs/rename", { path: it.path, new_name: v.name });
        toast(`已重命名为 ${r.new_path}`, "ok");
        refresh();
      } catch (e) { toast("重命名失败：" + e.message, "bad"); }
    });
}

function deleteEntry(it) {
  confirmDlg(`把 ${it.path} 移入回收站？（可在回收站页面恢复）`, async () => {
    try {
      await api("POST", "/api/fs/delete", { path: it.path });
      toast("已移入回收站", "ok");
      selected = null;
      document.getElementById("detail-card").style.display = "none";
      refresh();
    } catch (e) { toast("删除失败：" + e.message, "bad"); }
  }, true);
}

// ------------------------------------------------------------------ 目录冗余策略
document.getElementById("btn-policy").onclick = async () => {
  let view;
  try {
    view = await api("GET", "/api/fs/storage_policy?path=" + encodeURIComponent(currentPath));
  } catch (e) { toast("加载策略失败：" + e.message, "bad"); return; }
  const cur = view.policy;
  const profCards = view.profiles.map(p => `
    <label class="prof-card ${p.name === view.ec_profile ? "sel" : ""} ${p.fits ? "" : "nofit"}">
      <input type="radio" name="prof" value="${esc(p.name)}" ${p.fits ? "" : "disabled"}
             ${p.name === view.ec_profile ? "checked" : ""}>
      <div>
        <div><b>${esc(p.label)}</b>
          <span class="badge dim plain">需 ${p.nodes_required} 节点</span>
          <span class="badge ok plain">开销 ×${p.overhead}</span>
          ${p.fits ? "" : '<span class="badge bad plain">节点不足</span>'}</div>
        <div class="small muted">${esc(p.desc)}</div>
      </div>
    </label>`).join("");
  const html = `
    <div class="small muted" style="margin-bottom:10px">
      当前目录：<b class="mono">${esc(view.path)}</b> · 存活节点 ${view.live_nodes}
    </div>
    <div class="prof-opt">
      <label class="prof-line ${cur === "replica" ? "sel" : ""}">
        <input type="radio" name="pol" value="replica" ${cur === "replica" ? "checked" : ""}>
        <div><b>⧉ 三副本</b> <span class="small muted">每份数据存 3 份（×3），读取/恢复快</span></div>
      </label>
      <label class="prof-line ${cur === "ec" ? "sel" : ""}">
        <input type="radio" name="pol" value="ec" ${cur === "ec" ? "checked" : ""}>
        <div><b>🧩 纠删码</b> <span class="small muted">数据分片+校验分片（×1.5），更省空间</span></div>
        <div id="prof-list" style="margin-top:8px">${profCards}</div>
      </label>
      <label class="prof-line ${view.is_inherited ? "sel" : ""}">
        <input type="radio" name="pol" value="inherit" ${view.is_inherited ? "checked" : ""}>
        <div><b>↧ 跟随上级目录</b>
          <span class="small muted">继承 <b class="mono">${esc(view.effective.inherited_from || "系统默认（三副本）")}</b> 的策略</span></div>
      </label>
    </div>
    <hr class="hr">
    <div class="small" style="color:var(--warn)">
      ⓵ 切换只影响之后<b>新写入/覆盖</b>的文件；已有文件保持原冗余、可正常读写，
      两种冗余方式会在同一目录下并存、互不干扰。</div>`;
  modal({
    title: `🔀 目录冗余策略 · ${view.path}`, body: html, wide: true,
    okText: "保存策略",
    onOk: async (bodyEl) => {
      const pol = bodyEl.querySelector("input[name=pol]:checked").value;
      const profEl = bodyEl.querySelector("input[name=prof]:checked");
      try {
        const r = await api("POST", "/api/fs/storage_policy", {
          path: currentPath, policy: pol,
          profile: pol === "ec" ? (profEl ? profEl.value : "ec-2+1") : null,
        });
        toast("冗余策略已更新（旧文件保持不变）", "ok");
        refresh();
      } catch (e) { toast("保存失败：" + e.message, "bad"); return false; }
    }
  });
  // 选中样式联动
  document.querySelectorAll(".prof-opt input[name=pol]").forEach(r =>
    r.addEventListener("change", () => {
      document.querySelectorAll(".prof-line").forEach(l => l.classList.remove("sel"));
      r.closest(".prof-line").classList.add("sel");
    }));
  document.querySelectorAll(".prof-card input").forEach(r =>
    r.addEventListener("change", () => {
      document.querySelectorAll(".prof-card").forEach(l => l.classList.remove("sel"));
      r.closest(".prof-card").classList.add("sel");
    }));
};

document.getElementById("btn-mkdir").onclick = () => {
  promptDlg("新建目录", [
    { name: "name", label: `在 ${currentPath} 下创建目录`, placeholder: "例如 project-x" },
  ], async (v) => {
    if (!v.name.trim()) return;
    try {
      await api("POST", "/api/fs/mkdir", { path: currentPath, name: v.name.trim() });
      toast("目录已创建", "ok");
      refresh();
    } catch (e) { toast("创建失败：" + e.message, "bad"); }
  });
};

// ------------------------------------------------------------------ 刷新
async function refresh() {
  try {
    await Promise.all([loadTree(), loadList()]);
    history.replaceState(null, "", "?path=" + encodeURIComponent(currentPath));
  } catch (e) { toast("加载失败：" + e.message, "bad"); }
}

document.getElementById("btn-refresh").onclick = refresh;
document.getElementById("btn-refresh-tree").onclick = refresh;
document.getElementById("detail-close").onclick = () => {
  document.getElementById("detail-card").style.display = "none";
  selected = null;
};

initPage("files.html", "文件浏览").then(refresh);
</script>
</body>
</html>
